# Continuous integration: typecheck, theme freshness, build, unit tests, smoke-load and packaging on every push and PR,
# plus the installer bootstraps on Linux, macOS and Windows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/build-theme.mjs --check
      - run: npm run build
      - run: node --test src/extension/*/__tests__/*.test.mjs src/webview/__tests__/*.test.mjs product/__tests__/*.test.mjs
      - run: node scripts/smoke-load.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: klammr-vsix
          path: dist/klammr.vsix

  bootstraps:
    name: installer bootstraps (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The bootstraps only find Node.js and start install.mjs / uninstall.mjs; --help proves both work in this OS's
      # shell (Windows PowerShell 5.1 behind install.cmd on Windows).
      - name: install.sh / uninstall.sh --help
        if: runner.os != 'Windows'
        run: |
          sh product/install.sh --help
          sh product/uninstall.sh --help
      - name: install.cmd / uninstall.cmd --help
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call product\install.cmd --help || exit /b 1
          call product\uninstall.cmd --help || exit /b 1
